name: Refresh UI screenshots

on:
  push:
    branches:
      - release/rustore-publication
    paths:
      - .github/workflows/refresh-ui-screenshots.yml
      - app/src/main/java/com/worktime/app/ui/dayeditor/DayEditorFields.kt

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Refresh screenshot baselines
        run: ./gradlew --no-daemon :app:updateDebugScreenshotTest --stacktrace
      - name: Upload refreshed screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: polished-ui-screenshots
          path: app/src/screenshotTestDebug/reference
          if-no-files-found: error
          retention-days: 7
      - name: Commit refreshed baselines
        run: |
          git add app/src/screenshotTestDebug/reference
          if git diff --cached --quiet; then
            echo "Screenshot baselines are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh day editor spacing screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
