name: Generate RuStore listing assets

on:
  push:
    branches:
      - release/rustore-publication
    paths:
      - scripts/generate_rustore_assets.py
      - .github/workflows/generate-rustore-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/rustore-publication
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate RuStore assets
        run: python scripts/generate_rustore_assets.py

      - name: Commit generated assets
        run: |
          git add docs/rustore/assets/*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "assets: generate RuStore listing graphics"
          git pull --rebase origin release/rustore-publication
          git push origin HEAD:release/rustore-publication
