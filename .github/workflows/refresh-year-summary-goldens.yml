name: Refresh Year Summary goldens

on:
  push:
    branches: [fix/year-summary-fixed-viewport]

permissions:
  contents: write

concurrency:
  group: refresh-year-summary-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-goldens:
    if: ${{ !contains(github.event.head_commit.message, '[goldens-refreshed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Regenerate screenshot references
        run: ./gradlew --no-daemon :app:updateDebugScreenshotTest --stacktrace
      - name: Commit reviewed Year Summary goldens
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            'app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/YearSummaryEmptyDarkScreenshot_Year summary empty dark_df63d121_0.png' \
            'app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/YearSummaryLargeFontScreenshot_Year summary large font_6a4e2587_0.png' \
            'app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/YearSummaryPopulatedScreenshot_Year summary populated_b8aa34c2_0.png'
          if git diff --cached --quiet; then
            echo 'No Year Summary golden changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh year summary goldens [goldens-refreshed]'
          git push origin HEAD:${{ github.ref_name }}
