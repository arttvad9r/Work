name: Export interface screenshots

on:
  push:
    branches:
      - ui/full-interface-polish
    paths:
      - .github/workflows/export-interface-screenshots.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/full-interface-polish

      - name: Upload interface screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: interface-polish-screenshots
          path: app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/*.png
          if-no-files-found: error
          retention-days: 1
