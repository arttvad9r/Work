name: Refresh calendar screenshot goldens

on:
  push:
    branches:
      - feat/interaction-feedback-polish

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'arttvad9r/Work'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/interaction-feedback-polish
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Regenerate screenshot references
        run: ./gradlew --no-daemon :app:updateDebugScreenshotTest --stacktrace
      - name: Verify only expected references changed
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              "app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/CalendarPopulatedDarkScreenshot_Calendar populated dark_1552a2cd_0.png",
              "app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/CalendarPopulatedLightScreenshot_Calendar populated light_d57e6e9a_0.png",
          }
          changed = set(filter(None, subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()))
          print("Changed references:", sorted(changed))
          if changed != expected:
              raise SystemExit(f"Unexpected screenshot reference changes: {sorted(changed ^ expected)}")
          PY
      - name: Commit refreshed references and remove one-off workflow
        run: |
          rm -f .github/workflows/refresh-goldens.yml
          rm -f app/src/screenshotTestDebug/reference/.golden-update-marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/ \
            .github/workflows/refresh-goldens.yml \
            app/src/screenshotTestDebug/reference/.golden-update-marker
          git commit -m "test: refresh calendar screenshot references"
          git push origin HEAD:feat/interaction-feedback-polish
