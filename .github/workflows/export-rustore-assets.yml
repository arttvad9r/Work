name: Export RuStore source assets

on:
  push:
    branches:
      - release/rustore-publication
    paths:
      - .github/workflows/export-rustore-assets.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/rustore-publication

      - name: Upload source assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustore-source-assets
          path: |
            app/src/main/res/drawable-nodpi/ic_launcher_exact.webp
            app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/*.png
          if-no-files-found: error
          retention-days: 1
