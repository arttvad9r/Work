name: Export calendar screenshots

on:
  push:
    branches:
      - ui/calendar-readability
    paths:
      - .github/workflows/export-calendar-screenshots.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/calendar-readability

      - name: Upload calendar screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: calendar-readability-screenshots
          path: |
            app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/CalendarPopulatedLightScreenshot_Calendar populated light_d57e6e9a_0.png
            app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/CalendarPopulatedDarkScreenshot_Calendar populated dark_1552a2cd_0.png
          if-no-files-found: error
          retention-days: 1
