name: Refresh calendar screenshots

on:
  push:
    branches: [ui/calendar-readability]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Refresh screenshot baselines
        run: ./gradlew --no-daemon :app:updateDebugScreenshotTest --stacktrace
      - name: Commit refreshed calendar baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/screenshotTestDebug/reference/com/worktime/app/ui/screenshot/WorkTimeScreenshotTestKt/CalendarPopulated*.png
          if git diff --cached --quiet; then
            echo "No calendar screenshot changes generated"
            exit 0
          fi
          git commit -m "test: refresh calendar screenshot baselines"
          git push origin HEAD:ui/calendar-readability
