name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal numbered steps.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Android version, device/emulator, app version/commit.
  - type: textarea
    id: data_risk
    attributes:
      label: Data or salary impact
      description: Could this corrupt stored entries or calculate money incorrectly?
